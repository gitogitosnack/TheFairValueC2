<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>評価モデル一覧</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@3.0.2/destyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/master-list.css}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a th:href="@{/top}"><i class="fa-solid fa-chart-line"></i>TheFairValue</a>
            </div>
            <ul class="nav-menu">
                <li><a th:href="@{/top}">銘柄一覧</a></li>
                <li><a th:href="@{/countries}">国マスタ</a></li>
                <li><a th:href="@{/currencies}">通貨マスタ</a></li>
                <li><a th:href="@{/industries}">業種マスタ</a></li>
                <li><a th:href="@{/valuation-models}" class="active">評価モデル</a></li>
                <li><a th:href="@{/settings}">設定</a></li>
            </ul>
            <div class="nav-user">
                <span class="user-name">テスト太郎 様</span>
                <button class="btn-logout">ログアウト</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <header class="page-header">
            <h1><i class="fa-solid fa-calculator"></i>評価モデル一覧</h1>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" placeholder="モデル名を入力（部分一致）" id="searchInput">
                <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i>検索</button>
                <button class="btn btn-secondary"><i class="fa-solid fa-rotate-left"></i>クリア</button>
            </div>
            <div class="action-buttons">
                <button class="btn btn-export" th:data-export-url="@{/rest_valuation_models/export}"><i class="fa-solid fa-file-excel"></i>Excel出力</button>
            </div>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h2>
                    <i class="fa-solid fa-list-ul"></i>登録評価モデル一覧
                    <span class="record-count" th:text="'(' + ${items != null ? #lists.size(items) : 0} + '件)'">(0件)</span>
                </h2>
                <button id="addModelBtn" class="btn btn-success"><i class="fa-solid fa-plus"></i>新規モデル登録</button>
            </div>

            <div class="table-scroll">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>モデル名</th>
                            <th>式説明</th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${items}">
                            <td th:text="${item.id}">1</td>
                            <td class="main-cell" th:text="${item.modelName}">DCF</td>
                            <td class="desc-cell" th:text="${item.formulaDescription}">将来キャッシュフローの割引</td>
                            <td class="action-cell"><a href="#" class="operation-link edit-link"><i
                                        class="fa-solid fa-pen-to-square"></i>編集</a></td>
                            <td class="action-cell"><a href="#" class="operation-link delete-link"
                                    th:data-id="${item.id}"><i class="fa-solid fa-trash-can"></i>削除</a></td>
                        </tr>
                        <tr th:if="${items == null or #lists.isEmpty(items)}">
                            <td class="empty-cell" colspan="5">
                                <i class="fa-regular fa-folder-open"></i>登録されている評価モデルがありません
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>評価モデル情報の編集</h2>
                <span class="close-btn">&times;</span>
            </div>
            <form id="editForm">
                <input type="hidden" id="modalId" name="id">
                <div class="modal-body">
                    <div class="form-group">
                        <label>モデル名</label>
                        <input type="text" id="modalModelName" name="modelName" required>
                    </div>
                    <div class="form-group">
                        <label>式説明</label>
                        <input type="text" id="modalFormulaDescription" name="formulaDescription" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary close-modal">キャンセル</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i>保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script th:src="@{/js/master-list-search.js}"></script>
    <script th:src="@{/js/master-list-export.js}"></script>
    <script th:src="@{/js/valuation-model.js}"></script>
</body>

</html>
