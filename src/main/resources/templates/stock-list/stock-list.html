<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銘柄一覧</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@3.0.2/destyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/master-list.css}">
</head>
<body>
<!-- headerBar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a th:href="@{/top}"><i class="fa-solid fa-chart-line"></i>TheFairValue</a>
            </div>
            <ul class="nav-menu">
                <li><a th:href="@{/top}" class="active">銘柄一覧</a></li>
                <li><a th:href="@{/countries}">国マスタ</a></li>
                <li><a th:href="@{/currencies}">通貨マスタ</a></li>
                <li><a th:href="@{/industries}">業種マスタ</a></li>
                <li><a th:href="@{/valuation-models}">評価モデル</a></li>
                <li><a href="#">設定</a></li>
            </ul>
            <div class="nav-user">
                <span class="user-name">テスト太郎 様</span>
                <button class="btn-logout">ログアウト</button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <header class="page-header">
            <h1><i class="fa-solid fa-gauge-high"></i>銘柄管理ダッシュボード</h1>
        </header>

        <!-- search condition input area -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" placeholder="銘柄名・コードを入力（部分一致）" id="searchInput">
                <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i>検索</button>
                <button class="btn btn-secondary"><i class="fa-solid fa-rotate-left"></i>クリア</button>
            </div>
            <div class="action-buttons">
                <button class="btn btn-export" th:data-export-url="@{/rest_stock_list/export}"><i class="fa-solid fa-file-excel"></i>Excel出力</button>
            </div>
        </section>

        <!-- search result display area -->
        <section class="list-section">
            <div class="list-header">
                <h2>
                    <i class="fa-solid fa-list-ul"></i>登録銘柄一覧
                    <span class="record-count"
                        th:text="'(' + ${stockList != null ? #lists.size(stockList) : 0} + '件)'">(0件)</span>
                </h2>
                <button id="addStockBtn" class="btn btn-success"><i class="fa-solid fa-plus"></i>新規銘柄登録</button>
            </div>

            <div class="table-scroll">
                <table class="stock-table">
                    <thead>
                    <tr>
                        <th>コード</th>
                        <th>銘柄名</th>
                        <th>市場</th>
                        <th>国</th>
                        <th>業種</th>
                        <th>通貨</th>
                        <th class="num">現在値</th>
                        <th></th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                        <tr th:each="stock : ${stockList}" th:data-id="${stock.id}">
                            <td>
                                <a th:href="@{/stock-detail/{code}(code=${stock.code})}" th:text="${stock.code}">
                                    7203
                                </a>
                            </td>
                            <td class="main-cell" th:text="${stock.name}">トヨタ自動車</td>
                            <td class="market-cell" th:text="${stock.market_name}">東証プライム</td>
                            <td th:text="${stock.country_name}">日本</td>
                            <td th:text="${stock.industry_name}">自動車</td>
                            <td th:text="${stock.currency_name}">Japanese Yen</td>
                            <td class="num">2,500.5</td>
                            <td class="action-cell"><a href="#" class="operation-link edit-link"
                                    th:data-id="${stock.id}"><i class="fa-solid fa-pen-to-square"></i>編集</a></td>
                            <td class="action-cell"><a href="#" class="operation-link delete-link"
                                    th:data-id="${stock.id}"><i class="fa-solid fa-trash-can"></i>削除</a></td>
                        </tr>
                        <tr th:if="${stockList == null or #lists.isEmpty(stockList)}">
                            <td class="empty-cell" colspan="9">
                                <i class="fa-regular fa-folder-open"></i>登録されている銘柄がありません
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

<!--  START: Modal for edit display  -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>銘柄情報の編集</h2>
                <span class="close-btn">&times;</span>
            </div>
            <form id="editForm">
                <input type="hidden" id="modalId" name="id">
                <div class="modal-body">
                    <div class="form-group">
                        <label>銘柄コード</label>
                        <input type="text" id="modalCode" name="code" required>
                    </div>
                    <div class="form-group">
                        <label>銘柄名</label>
                        <input type="text" id="modalName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>市場</label>
                        <select id="modalMarket_name" name="market_name">
                            <option value="東証プライム">東証プライム</option>
                            <option value="東証スタンダード">東証スタンダード</option>
                            <option value="東証グロース">東証グロース</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary close-modal">キャンセル</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i>保存</button>
                </div>
            </form>
        </div>
    </div>
<!--  END: Modal for edit display  -->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script th:src="@{/js/master-list-search.js}"></script>
    <script th:src="@{/js/master-list-export.js}"></script>
    <script th:src="@{/js/stock-list.js}"></script>
</body>
</html>
