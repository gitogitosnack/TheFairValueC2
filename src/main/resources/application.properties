# 銘柄データ定期取得バッチ（docs/batch-market-data-sync-design.md 6章参照）
marketdata.api.edinet.api-key=${EDINET_API_KEY:}
marketdata.api.edinet.base-url=${EDINET_BASE_URL:https://api.edinet-fsa.go.jp/api/v2}
marketdata.api.fmp.api-key=${FMP_API_KEY:}
marketdata.api.fmp.base-url=${FMP_BASE_URL:https://financialmodelingprep.com/api/v3}
marketdata.yfinance-service.base-url=${YFINANCE_SERVICE_BASE_URL:http://localhost:8081}

# Spring Batch（設計書 8.1 参照）。JobRepository の標準メタデータテーブルは
# db/migration/V005__spring_batch_schema.sql で手動適用する（既存の db/migration 運用に合わせるため、
# spring.batch.jdbc.initialize-schema=always にはしない。always だと起動のたびに CREATE TABLE を
# 再実行しようとしてエラーになる）。起動時に全 Job を自動実行する既定動作も無効化する
# （Job は JobLauncher.run() から明示的に起動する）。
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

# 内蔵 @Scheduled スケジューラ・cron 式（設計書 3.1・3.4・6 章参照）。既定は無効。
marketdata.schedule.scheduler-enabled=${MARKETDATA_SCHEDULER_ENABLED:false}
marketdata.schedule.quote-cron-jp=${MARKETDATA_QUOTE_CRON_JP:0 0 16 * * MON-FRI}
marketdata.schedule.quote-cron-us=${MARKETDATA_QUOTE_CRON_US:0 30 6 * * MON-FRI}
marketdata.schedule.financial-cron=${MARKETDATA_FINANCIAL_CRON:0 0 20 * * *}